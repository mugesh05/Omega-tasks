<html>
<head>
    <title>Shopping Cart</title>
   </head>
<body>
 <style>
        body {
            font-family: Arial;
            text-align: center;
        }
        .product {
            display: inline-block;
            border: 1px solid gray;
            padding: 20px;
            margin: 10px;
        }
        button {
            padding: 8px;
            cursor: pointer;
        }
    </style>
    <h1>Shopping Cart</h1>
    <div class="product">
        <h3>Shirt</h3>
        <p>₹500</p>
        <button onclick="addToCart(500)">Add to Cart</button>
    </div>

    <div class="product">
        <h3>Shoes</h3>
        <p>₹1000</p>
        <button onclick="addToCart(1000)">Add to Cart</button>
    </div>
    <div class="product">
        <h3>Watch</h3>
        <p>₹1500</p>
        <button onclick="addToCart(1500)">Add to Cart</button>
    </div>
    <h2>Cart Total: ₹<span id="total">0</span></h2>
    <script>
        let total = 0;
        function addToCart(price) {
            total = total + price;
            document.getElementById("total").innerHTML = total;
        }
    </script>
</body>
</html>
