<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }
        .box {
            border: 1px solid gray;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            padding: 8px;
            margin: 5px;
        }
        button {
            padding: 8px 15px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>BMI Calculator</h2>

        <input type="number" id="weight" placeholder="Weight in kg">
        <br>
        <input type="number" id="height" placeholder="Height in meter">
        <br><br>
        <button onclick="calculateBMI()">Calculate BMI</button>
        <h3 id="result"></h3>
   </div>

    <script>
        function calculateBMI() {
            let weight = document.getElementById("weight").value;
            let height = document.getElementById("height").value;
              let bmi = weight / ((height / 100) * (height / 100));
            document.getElementById("result").innerHTML = "BMI: " + bmi.toFixed(2);
        }
    </script>
</body>
</html>
